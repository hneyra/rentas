# `rentas-web`, servido como archivos estaticos. Y NADA MAS: aqui no hay reenvio a la API.
#
# ## Lo que este archivo NO tiene, y es la decision que lo distingue del monolito
#
# `infrastructure/frontend/nginx.conf` —el del monolito— lleva un bloque que **reenvia `/api/v1`
# al backend**, y alli ese reenvio no es comodidad: es lo unico que hace que su interfaz alcance
# su API sin CORS. El problema es el mismo aqui —esta medido que el backend **no publica ni una
# cabecera `Access-Control-Allow-Origin`**: cero `CorsConfiguration` y cero `@CrossOrigin` en todo
# `backend/`— pero **la solucion se toma un piso mas arriba**, y por eso aqui no hay ninguno.
#
# Quien pone la interfaz y la API en el MISMO ORIGEN es el ingreso: `infrastructure/src/descriptor.ts`
# parte la ruta en dos —`/rentas/api/v1` al backend y `/rentas` a esta interfaz— dentro del mismo
# `Host`, y en el compose lo hacen dos routers de Traefik con la misma regla. Desde el navegador
# todo cuelga de un solo origen, que es exactamente lo que el reenvio del monolito conseguia.
#
# Hacerlo aqui ADEMAS seria peor que redundante: habria **dos** caminos a la API —uno por Traefik y
# otro por dentro de este contenedor— y el dia que difieran, la mitad de las peticiones iria por un
# sitio que nadie revisa. Y obligaria a este contenedor a alcanzar al backend por la red, que es
# justo lo que su `NetworkPolicy` le niega a proposito (AC-7 de #44): una interfaz que solo sirve
# archivos no necesita hablar con nadie.
#
# ## Por que aqui se sirve en la RAIZ aunque de puertas afuera viva bajo `/rentas`
#
# El ingreso quita el prefijo (`stripPrefix`), asi que a este `nginx` las peticiones le llegan ya
# sin el: el navegador pide `/rentas/assets/index-<huella>.js` y aqui entra `/assets/index-<huella>.js`.
# Que el paquete pida esa ruta con el prefijo lo garantiza `vite.config.ts` con `base: '/rentas/'`,
# que esta puesto desde F-1 por ADR-0030 §2 — el mismo Traefik sirve las cuatro interfaces, y con
# `base: '/'` este paquete pediria `/assets/…`, que en el cluster es de otro sistema.
#
# ## El «200 que miente», que es el modo de fallo que este archivo existe para hacer ruidoso
#
# `try_files $uri /index.html` convierte cualquier ruta que no sea un archivo en la pantalla, con
# un **200**. Es lo que hace falta para que recargar en `#/contribuyentes` funcione, y es tambien
# la forma mas silenciosa de romper un despliegue: si el ingreso deja de quitar el prefijo, o si
# una huella no cuadra, el navegador pide un `.js` y recibe **HTML con codigo de exito**. No un
# error: una pagina. El sintoma es una pantalla en blanco y en la consola «Unexpected token '<'».
#
# Se cierra por los dos lados, y ninguno sobra:
#
#   1. `location /assets/` NO cae al `index.html` — un activo que falta da **404**, que es la
#      verdad. Es el bloque de abajo con su `try_files $uri =404`.
#   2. `location /rentas/` contesta 404 **diciendo la causa**. A este `nginx` no le puede llegar
#      nunca una ruta con el prefijo puesto: si llega, el `stripPrefix` del ingreso no esta
#      haciendo su trabajo. Sin este bloque esa averia entraria por `location /` y saldria como
#      el 200 de arriba; con el, el mensaje nombra al culpable.
#
# ## Las cabeceras de seguridad van REPETIDAS en cada bloque, y no es descuido
#
# `add_header` **no se hereda**: un bloque que declara una cabecera propia descarta TODAS las del
# nivel de arriba. Asi que escribirlas una vez a nivel `server` las apagaria en `/assets/`, en
# `index.html` y en `configuracion.js` —o sea en casi todo lo que se sirve— sin que nada lo diga.
# Van las tres en cada bloque, y `always` para que salgan tambien en las respuestas de error, que
# es donde mas importan: un 404 tambien se puede enmarcar en un `iframe`.
#
# ## Un solo `Cache-Control` por respuesta
#
# El monolito escribe `expires 1y;` **y** un `add_header Cache-Control`, y eso emite **dos**
# cabeceras `Cache-Control` en la misma respuesta: quien lea la primera se queda sin `immutable` y
# quien lea la segunda, sin la duracion. Aqui va una sola con las tres cosas dentro.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No se anuncia la version. Es lo unico que se puede hacer desde aqui contra el escaneo
    # automatizado, y cuesta una linea.
    server_tokens off;

    # Comprimir lo que se repite. Las imagenes y las fuentes ya vienen comprimidas y volver a
    # pasarlas por gzip solo gasta CPU, asi que no entran en la lista.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ── La pantalla ──────────────────────────────────────────────────────────────────────
    #
    # Las rutas de la aplicacion viven en el hash —`#panel`, `#contribuyentes`— pero recargar en
    # una ruta que no existe como archivo tiene que devolver la pantalla y no un 404 de nginx.
    location / {
        try_files $uri /index.html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # ── Los activos con huella ───────────────────────────────────────────────────────────
    #
    # `=404` y NO el `index.html`: ver «el 200 que miente» arriba. Un `.js` que falta tiene que
    # decir que falta.
    #
    # La huella en el nombre es lo que hace seguro el ano de cache: si el contenido cambia, el
    # nombre cambia. `index.html` no la lleva, y por eso tiene su propio bloque.
    #
    # EL `Cache-Control` VA **SIN** `always`, y es lo contrario que las tres de seguridad.
    #
    # Sin `always`, `add_header` se aplica solo a 2xx y a los redirigidos — que es exactamente lo
    # que se quiere aqui. Se midio con `always` puesto y un activo que no existe contestaba
    # `404` **con `max-age=31536000, immutable` dentro**: un navegador que cachee esa respuesta se
    # queda un ANO sin volver a pedir ese archivo. Y la ventana en que eso puede pasar es real
    # —un cliente con un `index.html` viejo pidiendo un activo que ya no esta—, de modo que el
    # remedio normal, recargar, no lo arregla: la respuesta que tiene guardada es el 404.
    #
    # Las tres de seguridad son el caso opuesto y por eso SI llevan `always`: un 404 tambien se
    # puede enmarcar en un `iframe`.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # ── La pagina, que si cambia ─────────────────────────────────────────────────────────
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # ── Las senias del ambiente ──────────────────────────────────────────────────────────
    #
    # `no-store` y no `no-cache`: este archivo lo reemplaza el `ConfigMap` al desplegar, y un
    # navegador que se quedara con el anterior mandaria al usuario al emisor OIDC del ambiente
    # que fuera. Ver `src/api/configuracion.ts`.
    location = /configuracion.js {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # ── La averia del prefijo, dicha en voz alta ─────────────────────────────────────────
    #
    # Ver «el 200 que miente». Aqui dentro nunca hay rutas que empiecen por `/rentas/`: el ingreso
    # quita ese prefijo antes de reenviar. Si aparece una, la configuracion del ingreso esta mal y
    # esto lo dice, en vez de servir el `index.html` con un 200 y dejar que el sintoma aparezca en
    # la consola del navegador de otra persona.
    location /rentas/ {
        # `types { }` vacia el mapa de extensiones para este bloque, y hace falta: sin el, nginx
        # deduce el tipo del `.js` de la URI y este mensaje —que es prosa— sale etiquetado
        # `application/javascript`. Medido. Con el mapa vacio manda `default_type`.
        types { }
        default_type text/plain;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        return 404 "El ingreso no quito el prefijo /rentas. Esta interfaz se sirve en la raiz del contenedor: revisa el middleware stripPrefix del IngressRoute (o las etiquetas de Traefik en el compose).\n";
    }
}
