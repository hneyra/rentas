          schema: { type: string }
        - name: conciliadaConRentas
          in: query
          required: false
          description: "Filtro «Conciliada con rentas» de la pantalla. Esta ruta no lo resuelve —el estado de conciliación se deriva de `declaracion_jurada`, que es de rentas, y catastro no puede depender de rentas (ADR-0015 §2)—: la petición que lo trae se redirige con 307 a `/catastro/fichas/conciliacion`, que es la misma grilla servida por rentas."
