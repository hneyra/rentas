  "/pagos/conciliacion":
    get:
      operationId: conciliacion_de_pagos
      summary: "Lo aplicado un día, para que la caja lo concilie"
      description: "Cuántos pagos de ese día llegaron, cuántos se imputaron, cuántos se rechazaron y por cuánto dinero. Lo pregunta `caja` para compararlo con su cierre de turno (ADR-0026 §3). **Es la única lectura que la caja hace de este sistema**, y no está en el camino del cobro: si no contesta, la conciliación de ese día no se cierra y la ventanilla sigue cobrando igual — ésa es la asimetría que la separación compra. El importe es el **neto**: las anulaciones restan. Comparar contra la suma bruta daría una diferencia igual al doble de lo anulado en cuanto alguien anule un recibo, que es lo más corriente que pasa en una ventanilla."
      tags: ["Tesorería"]
      parameters:
        - name: fecha
          in: query
          required: false
          description: "El día de caja que se concilia, en ISO. **Obligatorio para el servidor**: sin él habría que elegir uno —«hoy»— y una conciliación que se responde sola con la fecha del reloj no es reproducible al día siguiente (regla 6)."
          schema: { type: string, format: date }
      responses:
        200:
          description: Operacion realizada
          content:
            application/json:
              schema: { type: object }
        "403":
          $ref: "#/components/responses/SinMunicipalidad"
        "422":
          $ref: "#/components/responses/ErrorDeValidacion"
