  "/pagos":
    post:
      operationId: recibir_pago_de_caja
      summary: "Recibir un pago cobrado en caja"
      description: "El segundo `COMMIT` del camino del dinero (ADR-0026 §3). `caja` cobra contra una orden, emite el recibo y publica el pago; aquí se **imputa al libro**. **Es idempotente por `pagoId`, y ese identificador lo genera la caja**: un reintento de entrega manda el mismo, y por eso un pago inyectado dos veces produce **un solo asiento**. La garantía es un índice único, no una comprobación previa: dos entregas simultáneas se ordenan en el motor. **El código de estado dice si el pago era nuevo**: 201 la primera vez, 409 cuando ya estaba — y el 409 no es un error sino «ya lo tengo», que es lo que permite reintentar sin miedo. **Qué parte de la deuda extingue el importe lo decide este sistema**, no la caja (ADR-0026 §2): el orden del art. 31 del Código Tributario vive en un solo sitio. Un pago que el libro no admite **no se pierde y no se reintenta para siempre**: queda RECHAZADO con su motivo y la conciliación del día lo cuenta aparte, porque es dinero cobrado que alguien tiene que mirar. Y una anulación **reversa** — escribe asientos contrarios—: nunca borra, porque el libro es inmutable (ADR-0006)."
      tags: ["Tesorería"]
      requestBody:
        required: true
