  "/fiscalizacion/programas/{id}/muestra":
    get:
      operationId: fisc_programa_muestra
      summary: "Muestra sorteada del programa"
      description: "Los predios que el programa sorteó para inspeccionar, con la condición que la detección concluyó el día del sorteo y las dos superficies que comparó. Es la grilla «Predios seleccionados» de la pantalla y también de donde el acta de inspección resuelve sus tres identificadores —programa, contribuyente y predio—, que su catálogo dibuja de solo lectura. La columna «Estado» se DERIVA de si el predio ya tiene acta en el programa: no es una columna de la fila, porque guardarla dejaría dos verdades sobre lo mismo. Los tres campos del titular —contribuyenteId, codContribuyente y titular— salen NULOS en el predio sin titularidad vigente: es el predio que nadie reclama, el candidato de primer orden, y desde #586 la muestra lo admite en vez de apartarlo. Quien lo visite averigua quién lo ocupa y nombra al contribuyente al levantar el acta."
      tags: ["Fiscalización"]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: predio
          in: query
          required: false
          description: "Acota la muestra a un predio: es como el acta de inspeccion pide su propia fila"
          schema: { type: string }
        - name: pagina
          in: query
          required: false
          description: "Pagina que se pide, contada desde 0"
          schema: { type: string }
          example: "0"
        - name: tamano
          in: query
          required: false
          description: "Filas por pagina"
          schema: { type: string }
          example: "20"
        - name: ordenarPor
          in: query
          required: false
          description: "Campo por el que se ordena, en camelCase"
          schema: { type: string }
        - name: direccion
          in: query
          required: false
          description: "ASCENDENTE | DESCENDENTE"
          schema: { type: string }
          example: "ASCENDENTE"
      responses:
        200:
          description: Operacion realizada
          content:
            application/json:
              schema: { type: object }
        "404":
          description: "Lo que la peticion identifica no existe en esta municipalidad. **No es un fallo del servidor y reintentar no lo cambia**: el cuerpo es `problem+json` con `codigo: NO_ENCONTRADO` y dice que se buscaba."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          $ref: "#/components/responses/SinMunicipalidad"
        "422":
          $ref: "#/components/responses/ErrorDeValidacion"
    post:
      operationId: fisc_programa_generar_muestra
      summary: "Generar la muestra del programa"
      description: "Sortea los predios que el programa va a inspeccionar, aplicando sobre el padrón el ejercicio, el sector y el criterio de riesgo que el propio programa declara. No sortea un predio que otro programa abierto ya se llevó ni uno ya fiscalizado en el ejercicio, así que la muestra depende del orden: el primer programa que se genere se lleva los predios. Responde 409 si el programa ya la sorteó — una muestra es un acto y no se regenera, porque hay actas levantadas sobre ella. La respuesta dice sobre qué padrón se sorteó y no sólo cuántos entraron: detectados, predios, sinTitular —cuántos de los sorteados no tienen titular vigente— y los excluidos POR MOTIVO, de modo que detectados = predios + excluidosPorOtroPrograma + excluidosPorActaDelEjercicio. Un número suelto no distinguiría «otro programa se lo llevó» de «ya se fiscalizó», que se arreglan de maneras distintas (#586)."
      tags: ["Fiscalización"]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
