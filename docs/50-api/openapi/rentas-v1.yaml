        "422":
          $ref: "#/components/responses/ErrorDeValidacion"
    get:
      operationId: prescripciones_declaradas
      summary: "Prescripciones declaradas"
      description: |
        La relación de declaraciones de prescripción: **qué deuda quedó sin acción de
        cobro** (#674, RF-094).

        **La deuda sigue ahí, y eso es la decisión, no un defecto.** Lo que prescribe es
        la *acción* para exigir el pago —art. 43 del TUO del Código Tributario—, no la
        obligación: el libro conserva sus asientos, la deuda sigue siendo cartera
        pendiente y sigue contando como emisión del ejercicio en el panel de recaudación.
        Deja de contar cuando la administración la **da de baja** con RF-044, cuya
        primera causal se llama «PRESCRIPCIÓN DECLARADA» —participio: presupone esta
        declaración, que es su sustento y no la baja misma—.

        Por eso existe esta lectura: si la deuda inexigible no se puede *ver* en ninguna
        parte, quien audita la cartera no sabe qué parte de ella ya no se puede exigir, y
        quien registra la baja no tiene dónde encontrar el acto que la sustenta.

        **Ninguna cifra de dinero**, y no por descuido: la prescripción no extingue un
        importe. `ejerciciosPrescritos` es la lista de los que de verdad prescribieron
        —una solicitud pide un rango y se resuelve año por año, así que «procede en
        parte» es el caso corriente— y con el contribuyente y el tributo identifica la
        obligación alcanzada.
      tags: ["Valores"]
      parameters:
        - name: codContribuyente
          in: query
          required: false
          description: "Código del contribuyente. Un código que no está en el padrón es 404 nombrándolo, no una relación vacía."
          schema: { type: string }
        - name: tributo
          in: query
          required: false
          description: "Tributo sobre el que se declaró"
          schema: { type: string }
        - name: ejercicio
          in: query
          required: false
          description: "Acota a las declaraciones que RESOLVIERON ese ejercicio, hayan prescrito o no: cuáles prescribieron lo dice `ejerciciosPrescritos` de cada fila."
          schema: { type: string }
        - name: resultado
          in: query
          required: false
          description: "PROCEDE, PROCEDE_EN_PARTE o NO_PROCEDE; otro valor es 422"
          schema: { type: string }
        - name: pagina
          in: query
          required: false
          description: "Pagina que se pide, contada desde 0"
          schema: { type: string }
          example: "0"
        - name: tamano
          in: query
          required: false
          description: "Filas por pagina"
          schema: { type: string }
          example: "20"
        - name: ordenarPor
          in: query
          required: false
          description: "Campo por el que se ordena, en camelCase"
          schema: { type: string }
        - name: direccion
          in: query
          required: false
          description: "ASCENDENTE | DESCENDENTE"
          schema: { type: string }
          example: "ASCENDENTE"
      responses:
        200:
          description: Operacion realizada
          content:
            application/json:
              schema: { type: object }
        "404":
          description: "Lo que la peticion identifica no existe en esta municipalidad. **No es un fallo del servidor y reintentar no lo cambia**: el cuerpo es `problem+json` con `codigo: NO_ENCONTRADO` y dice que se buscaba."
          content:
