# ARCHIVO GENERADO — no editar a mano.
# Origen: los `endpoint` de design/sgtm-data-{1..5}.js.
# Regenerar con: node docs/50-api/generar-openapi.mjs
#
# Es el contrato PROPUESTO: define verbo, ruta y parametros de las 134
# operaciones que la interfaz espera. Los esquemas de cuerpo y respuesta se
# escriben cuando se implementa cada operacion.
openapi: 3.1.0
info:
  title: SGTM — Sistema de Gestion Tributaria Municipal
  version: 1.0.0-borrador
  description: |
    Contrato de la API del SGTM, derivado de las pantallas del prototipo de
    interfaz. Una operacion por opcion del menu.

    El identificador de municipalidad NO viaja en ninguna ruta, parametro ni
    cuerpo: sale del claim `municipalidad_id` del token validado (ADR-0005).
    Una peticion que lo mande por otro camino no lo consigue.

    Los importes son cadenas decimales, nunca numeros de coma flotante
    (RNF-055), y toda cifra de deuda indica a que fecha esta actualizada
    (RNF-075).
servers:
  - url: /rentas/api/v1
    description: Camino base
security:
  - tokenDeAcceso: []
tags:
  - name: "Inicio"
    description: "2 opciones del manual"
  - name: "Catastro"
    description: "12 opciones del manual"
  - name: "Rentas · Registro"
    description: "15 opciones del manual"
  - name: "Fiscalización"
    description: "8 opciones del manual"
  - name: "Tránsito"
    description: "23 opciones del manual"
  - name: "Infracciones administrativas"
    description: "13 opciones del manual"
  - name: "Tesorería"
    description: "10 opciones del manual"
  - name: "Consultas"
    description: "11 opciones del manual"
  - name: "Valores"
    description: "6 opciones del manual"
  - name: "Coactiva"
    description: "12 opciones del manual"
  - name: "Autorizaciones y licencias"
    description: "11 opciones del manual"
  - name: "Seguridad"
    description: "11 opciones del manual"
paths:
  "/indicadores/recaudacion":
    get:
      operationId: inicio
      summary: "Panel de recaudación"
      description: "Avance de la recaudación del ejercicio 2026 al 13 de agosto, con la cartera pendiente por tributo y las tareas abiertas de cada unidad."
      tags: ["Inicio"]
      parameters:
        - name: ejercicio
          in: query
          required: false
          schema: { type: string }
          example: "2026"
      responses:
        200:
          description: Operacion realizada
          content:
            application/json:
              schema: { type: object }
        "403":
          $ref: "#/components/responses/SinMunicipalidad"
        "422":
          $ref: "#/components/responses/ErrorDeValidacion"
  "/indicadores/trabajo-parado":
    get:
      operationId: inicio_trabajo_parado
      summary: "Trabajo parado, por módulo"
      description: |
        Lo que está esperando un acto de la administración y no cobra mientras espera,
        con su recuento por módulo y el importe **cuando se puede cifrar**.

        **La lista trae sólo los frentes que el perfil puede ver.** Cada uno lleva
        detrás el permiso de lectura de la pantalla del módulo donde se desatasca
        —`transito_padron`, `consulta_valores`, `coactiva_expedientes` y
        `consulta_fichas`—, y el que no se autoriza **no aparece**: ni vacío, ni con un
        guion, ni con una nota. Una fila vacía ya dice que ahí hay algo que mirar
        (ADR-0016 §2).

        **`importe` nulo no es cero.** Sólo el frente de Tránsito se cifra —la misma
        consulta que cuenta las papeletas suma su `importe_a_pagar`—; los otros tres
        salen con `importe: null` porque la consulta que sostiene su pantalla no suma
        ninguna cifra, y sumarla aquí sería una segunda definición. Un frente cifrado con
        cero filas sí trae `"0.00"`, y ésa es la diferencia que hay que poder dibujar.

        Cada recuento sale de **la misma** consulta que la grilla de su módulo, no de una
        segunda: si «sin notificar» significara una cosa aquí y otra allí, las dos cifras
        se contradirían y la de la pantalla de aterrizaje es la que se lee primero.

        **Faltan dos de los seis frentes del manual, y no por descuido.** El de Licencias
        —solicitudes con el plazo agotado— necesita el plazo del silencio positivo, que es
        un valor normativo sin publicar (D-02c, regla 5); el de Fiscalización —actas con
        diferencia sin liquidar— no tiene ninguna consulta de módulo que reutilizar,
        porque ninguna pantalla lista actas.
      tags: ["Inicio"]
      parameters:
        - name: ejercicio
          in: query
          required: false
          description: "Ejercicio contra el que se concilia el padrón de predios; el del reloj si no viene"
          schema: { type: string }
          example: "2026"
      responses:
        200:
          description: Operacion realizada
          content:
            application/json:
              schema: { type: object }
        "403":
          $ref: "#/components/responses/SinMunicipalidad"
        "422":
          $ref: "#/components/responses/ErrorDeValidacion"
  "/portal/deuda":
    get:
      operationId: portal
      summary: "Consulta y pago en línea"
      description: "Flujo público de autoconsulta: el contribuyente identifica su deuda, elige qué pagar y descarga su constancia sin acudir a la municipalidad."
      tags: ["Inicio"]
      parameters:
        - name: pagina
          in: query
          required: false
          description: "Pagina que se pide, contada desde 0"
          schema: { type: string }
          example: "0"
        - name: tamano
          in: query
          required: false
          description: "Filas por pagina"
          schema: { type: string }
          example: "20"
        - name: ordenarPor
          in: query
          required: false
          description: "Campo por el que se ordena, en camelCase"
          schema: { type: string }
        - name: direccion
          in: query
          required: false
          description: "ASCENDENTE | DESCENDENTE"
          schema: { type: string }
          example: "ASCENDENTE"
      responses:
        200:
          description: Operacion realizada
          content:
            application/json:
              schema: { type: object }
        "403":
          $ref: "#/components/responses/SinMunicipalidad"
        "422":
          $ref: "#/components/responses/ErrorDeValidacion"
  "/portal/situacion":
    get:
      operationId: portal_mi_situacion
      summary: "Mi situación en todas las municipalidades"
      description: |
        Lo que el ciudadano autenticado debe y tiene **en todas las municipalidades del
        sistema donde figure**, a **una sola** fecha de corte.

        **Sin ningún parámetro, y eso es la decisión.** El sujeto sale del claim
        `numero_documento` del token del realm del ciudadano —emisor distinto del de
        funcionarios—, validado criptográficamente por la cadena que sirve
        `/rentas/api/v1/portal/**`. Sustituye a `GET /portal/deuda?doc=…`, que contestaba
        «quién es esta persona y cuánto debe» a quien tecleara ocho dígitos.

        El servidor **recorre** el registro de municipalidades activas —una transacción y
        un `SET LOCAL` por rama, RLS en cada una—, compone y suma (RNF-083). No es una
        consulta multi-municipalidad: son *N* consultas de una municipalidad cuya unión se
        filtra a un documento firmado.

        `totalConsolidado` es `null` cuando alguna municipalidad no se pudo leer, y
        entonces `notaDelTotal` dice cuáles faltan: un total al que le falta una
        municipalidad es un importe plausible y equivocado.

        Un token de **funcionario** no autentica aquí (401); uno de ciudadano no autentica
        en ninguna otra ruta de la API.
      tags: ["Inicio"]
      responses:
        200:
          description: "La situación del ciudadano, municipalidad por municipalidad"
          content:
            application/json:
              schema: { type: object }
        "403":
          $ref: "#/components/responses/SinDocumentoAcreditado"
  "/catastro/fichas/urbana/{codRefCatastral}":
