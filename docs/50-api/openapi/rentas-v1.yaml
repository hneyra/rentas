        - name: desde
          in: query
          required: false
          description: "Primer dia del rango de emision, inclusive. La pantalla dibuja una sola «Fecha»; el rango es del backend, porque quien perdio el recibo recuerda la semana y no el dia"
          schema: { type: string }
        - name: hasta
          in: query
          required: false
          description: "Ultimo dia del rango, inclusive"
          schema: { type: string }
        - name: estado
          in: query
          required: false
          description: "Columna «Estado» de la grilla, usada como filtro. Se DERIVA del movimiento de anulacion (V30): el recibo no guarda ninguna columna de estado, porque no se actualiza. Un valor fuera de las dos palabras se rechaza con 422 en vez de leerse como «todos»"
          schema: { type: string, enum: [EMITIDO, ANULADO] }
