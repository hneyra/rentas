      summary: "Actas de inspección levantadas"
      description: "Las actas de inspección de la municipalidad, predial y vehicular en la misma lista: las dos comparten tabla y ciclo de vida, y cuál es cuál lo dice cuál de `predioId` y `vehiculoId` trae valor. Agregada por #599, y no antes a propósito: #546 midió que un listado no habría llenado la pantalla del acta —el cuerpo del POST tenía nueve campos contra los veintitrés que el manual dibuja— y que lo que faltaba era dónde guardar el **uso hallado**, hoy `usoHallado` (V76). **`totalElementos` cuenta todas las actas que el filtro deja pasar, no las de la página**: es de ahí de donde el embudo del programa llena su etapa «Inspeccionados», y sumar `visitado` fila a fila recompondría esa cifra sobre la página que se hubiera pedido. Un solo filtro, y es el único que alguien pide: las dos pantallas del acta no dibujan ninguno —su catálogo no declara ni filtros ni tabla—, así que publicar el predio, el hallazgo o el estado sería inventar promesas que ninguna pantalla hace. Exige LECTURA sobre `fisc_predial` **o** sobre `fisc_vehicular`: un perfil de fiscalización vehicular registraría actas que no podría volver a ver."
