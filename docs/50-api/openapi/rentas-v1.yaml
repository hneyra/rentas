  "/catastro/fichas/bienes-comunes/{codEdificacion}/actualizacion":
    put:
      operationId: actualizar_ficha_bienes
      summary: "Actualización de la ficha de bienes comunes"
      description: "Crea la versión siguiente de la ficha de bienes comunes y cierra la anterior. Las áreas comunes y su reparto se copian si el cuerpo no los declara; declararlos los reemplaza."
      tags: ["Catastro"]
