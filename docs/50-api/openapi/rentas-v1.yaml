  "/catastro/predios/{predioId}/titulares":
    post:
      operationId: registrar_titular_del_predio
      summary: "Alta de una cuota de titularidad"
      description: >-
        Declara **de quién es** el predio (#490, RF-005): el primer titular, o uno más de una
        copropiedad. Hasta aquí la titularidad se podía leer y transferir, pero **el primer titular
        no se podía registrar por HTTP** — sólo se transfiere lo que ya tiene dueño, y lo único que
        daba el primero era la siembra o el bloque de titular del alta de ficha.

        `condicion` decide si hace falta `porcentaje`: sólo `PROPIETARIO_UNICO` lo es por el
        total. Declarar una **copropiedad** es registrar dos o más cuotas.

        **Pasarse del 100 % es 409, y lo dice la base.** La suma de cuotas vigentes la vigila un
        disparador *diferido*, que habla al confirmar; tiene que ser diferido para que una
        transferencia —cerrar una cuota y abrir otra en la misma transacción— sea posible, porque
        entre las dos operaciones el total pasa de 100 a propósito.

        No reabre D-12 ([ADR-0019]): una titularidad que no llega al 100 % se registra igual, y
        determina sólo la porción con titular identificado.

        Exige `REGISTRO` sobre `actualizacion_catastro` —quien declara de quién es un predio
        está actualizando el catastro, no consultando el padrón— y la observación del usuario
        (RNF-052).
      tags: ["Catastro"]
      parameters:
        - name: predioId
          in: path
          required: true
          description: "El predio, por el `predioId` que publica cada fila de la consulta de fichas"
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        201:
          description: Operacion realizada
          content:
            application/json:
              schema: { type: object }
        "403":
          $ref: "#/components/responses/SinMunicipalidad"
        "422":
          $ref: "#/components/responses/ErrorDeValidacion"
    get:
      operationId: titulares_del_predio
      summary: "Titulares del predio, con su código de contribuyente"
      description: "Quién es titular de un predio a una fecha, con el código con el que se entra a su ficha de contribuyente. Es la resolución que la fila de `consulta_fichas` necesita para poder enlazar con la persona: la grilla publica el nombre del titular y no su identificador, y añadirlo allí convertiría «quien puede listar fichas» en «quien puede cosechar la correlación predio→persona de toda la municipalidad» (ADR-0015 §2.4). Por eso se resuelve **al clic, de un predio cada vez**: exige privilegio de lectura sobre `contribuyentes` —el permiso del padrón, no el de la pantalla desde la que se hace clic— y cada resolución deja fila en la bitácora con operación ACCESO, la devuelva o no algún titular. Devuelve la **lista** de cuotas vigentes, no «el» titular: un predio puede tener varios —dos cónyuges, una sucesión, un condominio—, cada uno con su porcentaje. La respuesta dice siempre a qué fecha contesta (regla 9, RNF-075). Del padrón no viaja nada más: ni el identificador interno del contribuyente, ni su documento; y de la titularidad, ni sus fechas ni el documento que la sustenta."
      tags: ["Rentas · Registro"]
      parameters:
        - name: predioId
          in: path
          required: true
          description: "El predio, por el `predioId` que publica cada fila de la consulta de fichas"
          schema: { type: string }
        - name: vigenteA
          in: query
          required: false
          description: "Fecha a la que se resuelve la titularidad; si falta, hoy. La titularidad de marzo no es la de setiembre, y la respuesta dice siempre a cuál contesta (regla 9)"
          schema: { type: string }
          example: "2026-08-28"
      responses:
        200:
          description: Operacion realizada
          content:
            application/json:
              schema: { type: object }
        "403":
          $ref: "#/components/responses/SinMunicipalidad"
        "422":
          $ref: "#/components/responses/ErrorDeValidacion"
  "/catastro/predios/{predioId}/inquilinos":
    get:
      operationId: inquilinos_del_predio
      summary: "Quién ocupa el predio, a una fecha"
      description: >-
        Los ocupantes del predio vigentes a la fecha (#490, #31). El manual los registra para la
        cobranza de arbitrios.

        Existe porque terminar una ocupación exige decir **cuál**, y ninguna lectura publicaba ese
        identificador.
      tags: ["Catastro"]
      parameters:
        - name: predioId
          in: path
          required: true
          description: "El predio, por el `predioId` que publica cada fila de la consulta de fichas"
          schema: { type: string }
        - name: fecha
          in: query
          required: false
          description: "Fecha a la que se resuelve la ocupacion; si falta, hoy. Quien ocupaba el predio en marzo no es necesariamente quien lo ocupa hoy, y una determinacion de arbitrios de marzo se explica con el de marzo (regla 9)"
          schema: { type: string }
          example: "2026-08-30"
      responses:
        200:
          description: Operacion realizada
          content:
            application/json:
              schema: { type: object }
        "403":
          $ref: "#/components/responses/SinMunicipalidad"
        "422":
          $ref: "#/components/responses/ErrorDeValidacion"
    post:
      operationId: registrar_inquilino
      summary: "Alta de inquilino"
      description: >-
        Registra a quien ocupa el predio sin ser su dueño (#490, #31). El inquilino entra por su
        **código de contribuyente** —para cobrarle hay que poder notificarle, y el domicilio cuelga
        del padrón—, con el documento que sustenta el registro y la observación del usuario.
      tags: ["Catastro"]
      parameters:
        - name: predioId
          in: path
          required: true
          description: "El predio, por el `predioId` que publica cada fila de la consulta de fichas"
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        201:
          description: Operacion realizada
          content:
            application/json:
              schema: { type: object }
        "403":
          $ref: "#/components/responses/SinMunicipalidad"
        "422":
          $ref: "#/components/responses/ErrorDeValidacion"
  "/catastro/predios/{predioId}/inquilinos/{inquilinoId}":
    put:
      operationId: finalizar_inquilino
      summary: "Fin de la ocupación"
      description: >-
        Termina la ocupación en una fecha (#490). **No borra** (regla 4, RNF-051): una
        determinación de arbitrios anterior pudo apoyarse en ella, y explicarla exige que la fila
        siga ahí.

        Una ocupación ya cerrada es 404 — no hay tal ocupación abierta que terminar. Exige
        `ELIMINACION`, el privilegio que el manual reserva para las bajas lógicas.
      tags: ["Catastro"]
      parameters:
        - name: predioId
          in: path
          required: true
          description: "El predio, por el `predioId` que publica cada fila de la consulta de fichas"
          schema: { type: string }
        - name: inquilinoId
          in: path
          required: true
          description: "La ocupación abierta que se termina, por el id que publica su listado"
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        200:
          description: Operacion realizada
          content:
            application/json:
              schema: { type: object }
        "403":
          $ref: "#/components/responses/SinMunicipalidad"
        "422":
          $ref: "#/components/responses/ErrorDeValidacion"
  "/catastro/predios":
    post:
      operationId: inscribir_predio
      summary: "Alta de predio, sin ficha"
      description: >-
        Da de alta un predio **sin levantarle ficha** (#489, RF-001), que es el orden natural de
        ventanilla: primero se identifica el predio —su código de referencia catastral, su
        ubicación, su tipo— y después se le levanta la ficha.

        Hasta aquí un predio sólo podía nacer como **efecto secundario** de
        `POST /catastro/fichas/…` —que lo crea si no existe— o por la carga cartográfica del
        perfil `batch`, así que registrar un lote recién numerado obligaba a inventarle una
        ficha. El predio entra con `fichado=false` en `GET /catastro/predios`, que es
        justamente la cola de saneamiento.

        Vía, sector y manzana entran por **código** —lo mismo que recibe la corrección del
        predio—, y se resuelven **dentro de la transacción**: una referencia que no existe es 404
        nombrándola, no un predio guardado a medias. Un código ya inscrito es **409**; la unicidad
        la sostiene `predio_codigo_uq`.

        Exige `REGISTRO` sobre `actualizacion_catastro`, y la observación del usuario es
        obligatoria (RNF-052). Ni un importe y ni un titular: el valor sale del cuadro de valores
        unitarios (D-02a) y la titularidad es otro acto.
      tags: ["Catastro"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        201:
          description: Operacion realizada
          content:
            application/json:
              schema: { type: object }
        "403":
          $ref: "#/components/responses/SinMunicipalidad"
        "422":
          $ref: "#/components/responses/ErrorDeValidacion"
    get:
      operationId: listado_de_predios
      summary: "Padrón de predios del catastro"
      description: "Los predios del catastro con su ubicación resuelta a **códigos** —los mismos que la corrección del predio recibe, para que la interfaz no tenga que traducir entre lo que lee y lo que manda—, incluidos **los que nadie ha fichado y los que están dados de baja**. No es la consulta de fichas con otro nombre: aquella lista fichas vigentes a una fecha, así que un predio sale en ella solo si alguien levantó su ficha. Con `fichado=false` da la cola de saneamiento —lo que entra por una carga cartográfica y todavía no tiene ficha—, que ninguna consulta del sistema sabía responder. `fichado` dice si se levantó la ficha alguna vez, no si sigue vigente hoy: eso llevaría fecha (regla 9). Ni un importe y ni un titular: quién es el propietario se resuelve al clic en `/catastro/predios/{predioId}/titulares` (ADR-0015 §2.4). Exige privilegio de LECTURA sobre `actualizacion_catastro`: encontrar el predio es el paso previo de los dos actos de esa pantalla, y pedir el de escribir dejaría sin mirar a quien solo mira."
      tags: ["Catastro"]
      parameters:
        - name: codRefCatastral
          in: query
          required: false
          description: "Prefijo del código de referencia catastral, no una igualdad: el código se compone de sector, manzana, lote y unidad, así que preguntar por un sector entero es lo que se hace al sanear una zona"
          schema: { type: string }
          example: "2501010010"
        - name: codigoDeSector
          in: query
          required: false
          description: "El sector, por su código; el mismo que la corrección del predio recibe"
          schema: { type: string }
          example: "SC-1"
        - name: estado
          in: query
          required: false
          description: "ACTIVO o DADO_DE_BAJA. Si falta, salen los dos: este listado es el del catastro y no el de la emisión, y esconder los retirados sería esconder lo que hay que revisar"
          schema: { type: string }
          example: "ACTIVO"
        - name: fichado
          in: query
          required: false
          description: "`true` o `false`, y nada más —cualquier otro valor es 422, no un false silencioso—. Si falta, salen los dos"
          schema: { type: string }
          example: "false"
        - name: titularidad
          in: query
          required: false
          description: "El censo de saneamiento de titularidad (#690). `SIN_TITULAR` son los predios sin ninguna cuota abierta —en Catacaos, 4 977 de 14 422—; `INCOMPLETA`, los que tienen cuotas y no suman 100 % —otros 304—; `COMPLETA`, los que sí. Importa porque el % de propiedad **pondera la base imponible** del predio (NEG-05 §1): uno cuyas cuotas suman 0,349 % tributa por el 0,349 % de su valor, y ninguna cifra parece mal porque la determinación sale correcta para lo registrado. Se suman las cuotas ABIERTAS, que es lo mismo que suma el disparador que impide pasar de 100. Cualquier otro valor es 422: un filtro ignorado devolvería el padrón entero y se leería como que todo está incompleto"
          schema: { type: string }
          example: "SIN_TITULAR"
