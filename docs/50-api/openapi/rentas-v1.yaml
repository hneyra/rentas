      operationId: registrar_ficha_bienes
      summary: "Alta de ficha de bienes comunes"
      description: "Inscribe la primera versión de la ficha de bienes comunes (RF-003) de un predio, y da de alta el predio en el mismo acto si todavía no existe. El cuerpo lleva el código de referencia catastral, la ubicación del predio, los datos de la ficha —áreas y categorías, ningún importe—, su titularidad inicial si ya se conoce, y la observación del usuario, obligatoria (RNF-052). Si el predio ya tiene ficha de ese tipo, es 409: lo que toca entonces es actualizarla."
