          description: "Filtro «Caja» de la pantalla: el codigo de la ventanilla que emitio"
          schema: { type: string }
          example: "C-01"
        - name: cajero
          in: query
          required: false
          description: "La cuenta de quien cobro. Del backend: la pantalla no lo dibuja, y sin el no se puede reconstruir lo que emitio un turno"
