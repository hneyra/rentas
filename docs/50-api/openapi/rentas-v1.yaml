  "/tesoreria/recibos":
    get:
      operationId: recibos_listado
      summary: "Recibos emitidos"
      description: "La grilla «Recibos localizados» de la pantalla de duplicado de recibo: los recibos que cuadran con los filtros, con su número impreso, el instante de emisión, a quién se le cobró, el importe **con la fecha a la que estaba actualizado** (regla 9, RNF-075), el medio de pago, cuántos duplicados se han sacado y si sigue en pie. Agregada por #548: hasta entonces un recibo sólo se podía pedir por su número impreso, así que quien perdía el papel no tenía forma de encontrarlo. No trae el desglose —una página de veinte filas no puede costar veinte lecturas del detalle: para eso está la otra ruta, que ya recibe el número—. Un contribuyente sin recibos devuelve una página vacía con `totalElementos: 0`, no un 404."
