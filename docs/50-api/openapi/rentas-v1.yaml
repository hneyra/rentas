      operationId: coactiva_deuda_del_expediente
      summary: "Deuda del expediente coactivo, obligación por obligación"
      description: "La deuda de un expediente **desglosada por obligación**: una fila por tributo, ejercicio y unidad, con su insoluto, reajuste, interés y gastos. Es la lectura de la que «Fraccionamiento coactivo» saca las filas que se acogen —su cuerpo las pide una a una, y una suma no las tiene—. Sale de la MISMA composición y a la misma fecha que la deuda del expediente que imprime la REC-2, así que la grilla y el papel no pueden discrepar. Las costas del procedimiento viajan marcadas (`esCosta`) y no escondidas: se cobran igual, pero no se acogen como una cuota más. Los tres totales vienen calculados del servidor (RNF-083)."
