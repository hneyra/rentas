        "403":
          $ref: "#/components/responses/SinMunicipalidad"
        "422":
          $ref: "#/components/responses/ErrorDeValidacion"
  "/catastro/fichas/conciliacion":
    get:
      operationId: consulta_fichas_conciliacion
      summary: "Consulta de fichas con su conciliación con rentas"
      description: "La misma grilla de `consulta_fichas` con la columna «Conciliada» y el filtro `conciliadaConRentas`. Un predio está conciliado a un ejercicio cuando existe una declaración jurada de ese ejercicio, con su mismo `predio_id`, en estado PRESENTADA u OBSERVADA (ADR-0015 §1). La sirve `rentas` y no `catastro` —el derivado sale de la declaración jurada y catastro no puede depender de rentas—, pero el acceso que exige es el de la pantalla, `consulta_fichas`. De la declaración jurada no viaja nada: ni su número, ni su tipo, ni sus importes, ni quién la presentó; solo el derivado y el ejercicio al que responde (regla 9). `conciliadaConRentas=No` —la lista de los predios que no generan deuda predial— exige además privilegio de lectura sobre `fisc_omisos` y deja fila en la bitácora con operación ACCESO."
      tags: ["Catastro"]
      parameters:
        - name: codRefCatastral
          in: query
          required: false
          description: "Filtro «Cod. Ref. Catastral» de la pantalla"
          schema: { type: string }
        - name: contribuyente
          in: query
          required: false
          description: "Filtro «Contribuyente» de la pantalla"
          schema: { type: string }
        - name: manzana
          in: query
          required: false
          description: "Filtro «Manzana» de la pantalla"
          schema: { type: string }
        - name: lote
          in: query
          required: false
          description: "Filtro «Lote» de la pantalla"
          schema: { type: string }
        - name: tipo
          in: query
          required: false
          description: "UNICA | ECONOMICA | BIENES_COMUNES | RURAL"
          schema: { type: string }
        - name: conciliadaConRentas
          in: query
          required: false
          description: "Todas | Sí | No. «No» exige privilegio de lectura sobre `fisc_omisos` y queda registrado en la bitácora (ADR-0015 §2.3)."
          schema: { type: string }
          example: "Todas"
        - name: ejercicio
          in: query
          required: false
          description: "A qué ejercicio responde la conciliación; si falta, el de la fecha de corte. La respuesta lo dice siempre (regla 9, RNF-075)"
          schema: { type: string }
          example: "2026"
        - name: fecha
          in: query
          required: false
          description: "Fecha de corte a la que se resuelven la versión de ficha y el titular vigentes; si falta, hoy"
          schema: { type: string }
          example: "2026-08-28"
        - name: pagina
          in: query
          required: false
          description: "Pagina que se pide, contada desde 0"
          schema: { type: string }
          example: "0"
        - name: tamano
          in: query
          required: false
          description: "Filas por pagina"
          schema: { type: string }
          example: "20"
        - name: ordenarPor
          in: query
          required: false
          description: "Campo por el que se ordena, en camelCase"
          schema: { type: string }
        - name: direccion
          in: query
          required: false
          description: "ASCENDENTE | DESCENDENTE"
          schema: { type: string }
          example: "ASCENDENTE"
      responses:
        200:
          description: Operacion realizada
          content:
            application/json:
              schema: { type: object }
        "403":
          $ref: "#/components/responses/SinMunicipalidad"
        "422":
          $ref: "#/components/responses/ErrorDeValidacion"
  "/catastro/fichas/conciliacion/resumen":
    get:
      operationId: conciliacion_resumen
      summary: "Recuento de la conciliación con rentas"
      description: "Cuántos predios del padrón hay a esa fecha, cuántos declararon ese ejercicio y cuántos no, resuelto en **una** consulta agregada y sin recorrer el padrón (#564). Existe porque la grilla no sirve para contar: su filtro se aplica sobre la página ya devuelta y su `totalElementos` es el del padrón sin filtrar. La población es la misma que lista la grilla —las fichas vigentes a la fecha—, y que lo siga siendo lo comprueba una prueba que compara las dos cifras. A diferencia de `conciliadaConRentas=No`, **no** exige privilegio sobre `fisc_omisos` y **no** deja fila en la bitácora: aquella nombra —es la lista de a quién no le va a llegar recibo— y ésta cuenta."
      tags: ["Catastro"]
      parameters:
        - name: ejercicio
          in: query
          required: false
          description: "A qué ejercicio responde el recuento; si falta, el de la fecha de corte. La respuesta lo dice siempre: no existe «sin conciliar», existe «sin conciliar a 2026» (regla 9, RNF-075)"
          schema: { type: string }
          example: "2026"
        - name: fecha
          in: query
          required: false
          description: "Fecha de corte a la que se resuelve qué versión de ficha rige, igual que en la grilla; si falta, hoy"
          schema: { type: string }
          example: "2026-08-28"
      responses:
        200:
          description: Operacion realizada
          content:
            application/json:
              schema: { type: object }
        "403":
          $ref: "#/components/responses/SinMunicipalidad"
        "422":
          $ref: "#/components/responses/ErrorDeValidacion"
  "/catastro/predios/plano":
    get:
      operationId: plano_catastral
      summary: "Plano catastral: los lotes de un marco"
      description: |
        Los lotes que caen dentro de un marco, **con su polígono**, para dibujar el plano
        catastral (ADR-0022). La geometría sale de `predio.geometria` —`geography(MultiPolygon,
        4326)`, ADR-0021— serializada a GeoJSON tal cual: **ni reproyectada ni simplificada**.
        Un vértice movido es un lindero movido, y un lindero movido no se ve.

        **Se acota por marco y se niega antes que recortarse.** `bbox` es obligatorio. Si
        dentro caben más lotes que `limite`, la respuesta es **422** diciendo cuántos hay:
        una página con los primeros dibujaría un plano al que le faltan lotes, y eso no se
        lee como «faltan», se lee como «ahí no hay nada». Por lo mismo no pagina.

        **`sinGeometria` cuenta los predios del padrón que pasan los mismos filtros de
        sector y de manzana y no tienen polígono, sin acotar por el marco**, y la interfaz lo
        dice siempre, incluso cuando es cero. Que no lo acote el marco no es una omisión: un predio
        sin polígono **no tiene sitio en el marco**, así que acotarlo por `bbox` daría cero
        siempre, y daría cero justo cuando la cifra más hace falta —hoy, sin un solo lote
        digitalizado—. El único dato que podría situarlo, el perímetro de su manzana, no existe
        en el esquema, y derivarlo de la unión de los lotes ya levantados es lo que ADR-0022 §5
        prohíbe. Sin esta cifra el visor afirma algo que no sabe: hoy no hay una sola
        municipalidad con geometría cargada, así que lo honesto es que el plano vacío diga por
        qué lo está —la carga cartográfica de ADR-0021— y no que parezca un distrito sin
        predios.

        Ni un importe y ni un titular, por lo mismo que `GET /catastro/predios`: quién es
        el propietario se resuelve al clic, de un predio cada vez, en
        `/catastro/predios/{predioId}/titulares` (ADR-0015 §2.4). Y **ninguna área**: la del
        polígono no es la imponible, y publicarlas juntas invita a compararlas donde no se
        decide nada.
      tags: ["Catastro"]
      parameters:
        - name: bbox
          in: query
          required: false
          description: "Marco en grados WGS84, `oeste,sur,este,norte`. Obligatorio: sin él la consulta sería el padrón entero, que es lo que esta operación existe para no hacer"
          schema: { type: string }
          example: "-80.71,-4.92,-80.66,-4.87"
        - name: codigoDeSector
          in: query
          required: false
          description: "Filtro «Sector» de la pantalla, por código"
          schema: { type: string }
        - name: codigoDeManzana
          in: query
          required: false
          description: "Filtro «Manzana» de la pantalla, por código"
          schema: { type: string }
        - name: limite
          in: query
          required: false
          description: "Cuántos lotes se sirven como máximo. Si el marco contiene más, la respuesta es 422 con la cuenta; nunca los primeros `limite`"
          schema: { type: string }
          example: "2000"
      responses:
        200:
          description: Operacion realizada
          content:
            application/json:
              schema: { type: object }
        "403":
          $ref: "#/components/responses/SinMunicipalidad"
        "422":
          $ref: "#/components/responses/ErrorDeValidacion"
  "/catastro/predios/plano/marco":
    get:
      operationId: marco_del_plano
      summary: "Dónde está lo levantado: el marco del plano"
      description: |
        El rectángulo que envuelve la geometría **ya cargada**, con los mismos filtros de sector
        y de manzana que `GET /catastro/predios/plano` (#612). Es de dónde sale el primer
        `bbox`: aquella operación lo exige, y hasta ahora ninguna decía dónde está la
        municipalidad, así que el visor abría sobre un marco declarado del país entero — y con
        geometría cargada eso contesta «hay N lotes, acércate», una respuesta correcta que desde
        la pantalla no se puede obedecer.

        **Sale de la geometría cargada, nunca de una constante.** Se agrega sobre las cuatro
        columnas que `V65` deriva del polígono de cada lote, con los **mismos** filtros que el
        plano: un marco calculado sobre otro conjunto de predios encuadraría sobre algo que
        después no se dibuja, y sobre un plano sin base cartográfica un encuadre equivocado **no
        se ve**.

        **`marco` es `null` cuando no hay ninguno que publicar, y `notaDelMarco` dice por
        qué.** Son dos situaciones distintas y se arreglan distinto: `lotes: 0` es que no hay
        ni un predio con polígono —el estado de hoy en todas las municipalidades, lo que falta es
        la carga cartográfica de ADR-0021— y `lotes > 0` con `marco: null` es que todo lo
        levantado cae sobre la misma línea, o sea que su envolvente no es un rectángulo. Nunca
        `0,0,0,0`: ese punto está en el golfo de Guinea.

        Lo que publica es **un rectángulo y una cuenta**, y nada más: ni un `predioId`, ni un
        código, ni una dirección. Añadir el del lote más al norte la convertiría en una forma de
        recorrer el padrón sin pedir el padrón.
      tags: ["Catastro"]
      parameters:
        - name: codigoDeSector
          in: query
          required: false
          description: "Filtro «Sector» de la pantalla, por código. El mismo que el del plano"
          schema: { type: string }
        - name: codigoDeManzana
          in: query
          required: false
          description: "Filtro «Manzana» de la pantalla, por código. El mismo que el del plano"
          schema: { type: string }
      responses:
        200:
          description: Operacion realizada
          content:
            application/json:
              schema: { type: object }
        "403":
          $ref: "#/components/responses/SinMunicipalidad"
        "422":
          $ref: "#/components/responses/ErrorDeValidacion"
  "/catastro/fichas/{codigo}/actualizacion":
    put:
      operationId: actualizacion_catastro
      summary: "Actualización del catastro"
      description: "Actualiza construcciones y otras instalaciones de una ficha ya registrada. El sistema conserva cada versión declarada y verificada por piso, con su MEP, ECS, ECC y estado de conservación."
      tags: ["Catastro"]
      parameters:
        - name: codigo
          in: path
          required: true
          schema: { type: string }
        - name: codRefCatastral
          in: query
          required: false
          description: "Filtro «Cod. Ref. Catastral» de la pantalla"
          schema: { type: string }
        - name: nDeFicha
          in: query
          required: false
          description: "Filtro «Nº de ficha» de la pantalla"
          schema: { type: string }
        - name: sector
          in: query
          required: false
          description: "Filtro «Sector» de la pantalla"
          schema: { type: string }
        - name: tipoDeActualizacion
          in: query
          required: false
          description: "Filtro «Tipo de actualización» de la pantalla"
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        200:
          description: Operacion realizada
          content:
            application/json:
              schema: { type: object }
        "403":
          $ref: "#/components/responses/SinMunicipalidad"
        "422":
          $ref: "#/components/responses/ErrorDeValidacion"
  "/catastro/fichas/economica/{codRefCatastral}/actualizacion":
    put:
      operationId: actualizar_ficha_economica
      summary: "Actualización de la ficha económica"
      description: "Crea la versión siguiente de la ficha económica y cierra la anterior, que queda entera. Lo que el cuerpo no manda, no cambia: una lista ausente copia la de la versión vigente y una lista presente aunque vacía la reemplaza."
      tags: ["Catastro"]
