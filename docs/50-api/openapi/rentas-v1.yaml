          description: "PDF, XLS o RTF; sin el, la respuesta es JSON (RF-132)"
          schema: { type: string }
      responses:
        200:
          description: Operacion realizada
          content:
            application/json:
              schema: { type: object }
        "404":
          description: "Lo que la peticion identifica no existe en esta municipalidad. **No es un fallo del servidor y reintentar no lo cambia**: el cuerpo es `problem+json` con `codigo: NO_ENCONTRADO` y dice que se buscaba."
