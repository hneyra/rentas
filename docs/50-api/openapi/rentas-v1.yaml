          required: false
          description: "Filtro «Grupo / Usuario» de la pantalla"
          schema: { type: string }
        - name: acceso
          in: query
          required: false
          description: "Filtro «Acceso» de la pantalla"
          schema: { type: string }
      requestBody:
        required: true
        content:
