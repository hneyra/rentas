  "/consultas/altas-bajas":
    get:
      operationId: consulta_altas_bajas
      summary: "Consulta de altas y bajas"
      description: >-
        Los **actos** de alta y de baja de deuda de un contribuyente (RF-043, RF-044), con el documento
        que los aprueba y el motivo con que se registraron.

        **No es todo el movimiento del libro.** Un cobro de ventanilla no sale aquí —es un pago, y lo
        lista `GET /consultas/pagos`— ni el cargo de la emisión, aunque los tres se escriban con los
        mismos conceptos del desglose: el abono de una baja y el de una cobranza son, columna a
        columna, el mismo asiento. Lo que los separa es de qué acto nace la fila.

        **Los movimientos anteriores a la migración que estampa ese dato no aparecen**, y no se pueden
        recuperar: el libro no admite corrección —se anula, se da de baja o se reversa— y las filas ya
        escritas nacieron sin él. Para una instalación con historia previa, esta relación empieza el día
        en que se aplicó esa migración; lo anterior se consulta como movimientos de la cuenta corriente.

        **También salen las bajas que dicta una resolución de gerencia** —la que deja una multa sin
        efecto, y la que declara fundado un descargo—: son una baja de deuda como la de la pantalla que
        la registra a mano, con las mismas causales, y el documento que las sustenta es el número de esa
        resolución.

        **«Auto / Manual» no se sirve** y se rechaza con 422 en vez de ignorarse: el origen de un acto
        —tecleado en ventanilla o dictado por un procedimiento— no es un dato que esta relación pueda
        consultar. Lo que el libro guarda es de qué acto nace la fila, no quién la produjo; quien lo
        dice es el documento que la sustenta, y eso es texto.
      tags: ["Consultas"]
      parameters:
        - name: tipoDeConsulta
          in: query
          required: false
          description: "Filtro «Tipo de consulta» de la pantalla"
          schema: { type: string }
        - name: codigoCont
          in: query
          required: false
          description: "Filtro «Código Cont.» de la pantalla"
          schema: { type: string }
        - name: codContribuyente
          in: query
          required: false
          description: "Codigo del contribuyente, con el nombre unificado. «codigoCont» es el mismo dato"
          schema: { type: string }
        - name: ano
          in: query
          required: false
          description: "Filtro «Año» de la pantalla, dentro de «Filtros del detalle»"
          schema: { type: string }
        - name: tributo
          in: query
          required: false
          description: "Filtro «Tributo» de la pantalla, dentro de «Filtros del detalle»"
          schema: { type: string }
        - name: altaBaja
          in: query
          required: false
          description: "Filtro «Alta / Baja» de la pantalla"
          schema: { type: string }
        - name: causal
          in: query
          required: false
          description: >-
            Por que se dio de baja la deuda. El vocabulario es el del desplegable «Causal» de la
            pantalla de baja de deuda, letra por letra salvo la tilde y el espacio, que ningun
            identificador lleva; cualquier otra palabra se rechaza con 422 nombrando lo admitido en
            vez de devolver la relacion entera bajo un filtro que no acota. Acota a las bajas —un
            alta no tiene causal— y deja fuera las anteriores a la migracion que estampa la
            columna, que la tienen vacia y no se pueden reparar.
          schema: { type: string, enum: [PRESCRIPCION_DECLARADA, RESOLUCION_QUE_DEJA_SIN_EFECTO, ERROR_MATERIAL, COMPENSACION, DEUDA_DE_COBRANZA_DUDOSA, CONDONACION_POR_ORDENANZA] }
          example: "PRESCRIPCION_DECLARADA"
        - name: autoManual
          in: query
          required: false
          description: "Filtro «Auto / Manual» de la pantalla. El backend todavia no distingue un movimiento automatico de uno manual y lo ignora"
          schema: { type: string }
        - name: pagina
          in: query
          required: false
          description: "Pagina que se pide, contada desde 0"
          schema: { type: string }
          example: "0"
        - name: tamano
          in: query
          required: false
          description: "Filas por pagina"
          schema: { type: string }
          example: "20"
        - name: ordenarPor
          in: query
          required: false
          description: "Campo por el que se ordena, en camelCase"
          schema: { type: string }
        - name: direccion
          in: query
          required: false
          description: "ASCENDENTE | DESCENDENTE"
          schema: { type: string }
          example: "ASCENDENTE"
      responses:
        200:
          description: Operacion realizada
          content:
            application/json:
              schema: { type: object }
        "404":
          description: "Lo que la peticion identifica no existe en esta municipalidad. **No es un fallo del servidor y reintentar no lo cambia**: el cuerpo es `problem+json` con `codigo: NO_ENCONTRADO` y dice que se buscaba."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          $ref: "#/components/responses/SinMunicipalidad"
        "422":
          $ref: "#/components/responses/ErrorDeValidacion"
