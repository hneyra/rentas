  "/fiscalizacion/programas":
    get:
      operationId: fisc_programas_listado
      summary: "Programas de fiscalización"
      description: "La grilla de programas de fiscalización de la pantalla `fisc_programa`, que declara el POST —programar— como su endpoint y necesita un verbo aparte para listar. Agregada por #431: sin ella un programa se registraba y no se podía volver a encontrar, y las actas predial y vehicular —que exigen el `programaId` de un programa ya generado— no tenían ninguna fila real de la que resolverlo. «Ejercicio» filtra por VIGENCIA y no por el año de inicio: un programa que arranca en diciembre y cierra en marzo es un programa del ejercicio siguiente para quien lo busca. Los otros dos desplegables de la pantalla —«Tipo» y «Estado»— no viajan: nombran clases y situaciones que el sistema no registra."
