      operationId: dar_de_baja_predio
      summary: "Baja del predio en el padrón"
      description: "Retira el predio del padrón. **No borra nada** (regla 4, RNF-051): sus fichas, su titularidad y las determinaciones que se apoyaron en él quedan como estaban, y el predio deja de admitir fichas nuevas. Exige privilegio de ELIMINACIÓN sobre `actualizacion_catastro` —no el de modificación— porque saca la unidad de toda emisión futura. El cuerpo lleva solo la observación del usuario, obligatoria (RNF-052): el predio y el estado al que se va los dice la ruta. Un predio que ya está dado de baja es 409, no un segundo acto sin efecto."
