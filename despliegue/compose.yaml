# ============================================================================
#  RENTAS, LEVANTADO CONTRA LA PLATAFORMA (ADR-0031 §4, C-18)
#
#  Solo lo de este sistema: su migrador, su implantacion y su backend. NO trae
#  PostgreSQL ni Keycloak — los usa, y los levanta el compose de la plataforma,
#  que vive en el clon hermano `infrastructure`:
#
#      docker compose -f ../infrastructure/despliegue/plataforma.compose.yaml up -d --wait
#      docker compose -f despliegue/compose.yaml up --build --wait
#
#  ESTE ARCHIVO Y EL DESCRIPTOR TIENEN QUE DECIR LO MISMO. Es la trampa que
#  ADR-0011 anoto —«dos formas de levantar el sistema, que se separen, que una
#  variable nueva entre en el cluster y no en el compose»— y con cuatro sistemas
#  se multiplica por cuatro. Lo que lo sujeta es una guarda de `infrastructure`,
#  `infra/verificaciones/compose-de-los-sistemas.test.ts`, que lee este archivo y
#  `infrastructure/src/descriptor.ts` y compara las dos mitades: los nombres de
#  las variables de entorno de cada proceso, la base a la que apunta cada uno, el
#  rol con que se conecta, el prefijo de la ruta y los dos objetivos del
#  Dockerfile. No se copia una lista a mano: se derivan las dos y se comparan.
#
#
#  LO QUE ESTE COMPOSE NO TRAE, Y SE DICE EN VEZ DE DESCUBRIRSE: el `CronJob` del
#  ingestor. En el cluster lo declara `lotes()` del descriptor y esta SUSPENDIDO
#  desde C-8, porque el feed de `catastro` esta detras de `@RequiereAcceso` y no
#  hay identidad de servicio (ADR-0028 §2, RFC 8693). Aqui tampoco esta, y por un
#  motivo mas: el perfil `batch` TERMINA el proceso, asi que un servicio mas seria
#  un contenedor que sale con codigo 0 y al que Compose reiniciaria en bucle —el
#  defecto 5 de C-17—. Queda como hueco declarado de C-18.
#  Y DESDE #44 SI HAY FRONTEND. Hasta aqui este bloque decia «AQUI NO HAY
#  FRONTEND, y no es un olvido», y daba su motivo: que `frontend/` era andamiaje
#  sin ninguna pantalla, de modo que un servicio aqui habria sido «un contenedor
#  que sirve una pagina con un `<h1>` y poco mas».
#
#  ESE MOTIVO CADUCO, y por eso el comentario se reescribe en vez de borrarse.
#  `rentas-web` tiene sus cuatro secciones (Panel, Contribuyentes, Determinacion
#  y Valores), entra por Keycloak con PKCE, lee doce rutas del backend y escribe
#  una. Lo que quedaba pendiente era justo lo contrario de lo que aquel parrafo
#  decia: no faltaban pantallas, faltaba la imagen. Con #44 existe, asi que entra.
#
#  LO QUE ESTE SERVICIO NO HACE, que es la mitad importante: no reenvia nada al
#  backend, y por eso NO tiene `depends_on`. Quien pone la interfaz y la API en el
#  mismo origen es Traefik, partiendo `/rentas` en dos. El motivo largo esta en el
#  propio servicio.
# ============================================================================

name: kamayuk-rentas

services:
  # ── El migrador, que corre y termina ────────────────────────────────────────
  #
  # La imagen del MIGRADOR, no la de la aplicacion (C-14, punto 1): son dos
  # objetivos del mismo `Dockerfile` y estan separados porque las credenciales de
  # `kamayuk_owner` —el unico rol con DDL— existen durante la migracion y desaparecen
  # con ella. Meterlas en la imagen de la aplicacion le daria DDL sobre el padron
  # a un proceso de larga vida expuesto en HTTP (ARQ-03 §4).
  #
  # Lee `KAMAYUK_DB_OWNER_USUARIO` y `KAMAYUK_DB_OWNER_CLAVE`, y NO `KAMAYUK_DB_USUARIO`:
  # lo dice el `main` de `kamayuk.rentas.esquema.Migrador`, que rechaza
  # argumentos a proposito para que una clave no quede en el historial del proceso.
  rentas-migraciones:
    build:
      # El contexto es la RAIZ del repositorio, no `backend/`: el `.dockerignore`
      # que lo acota vive alli y desde `backend/` no se aplica.
      context: ..
      dockerfile: backend/Dockerfile
      target: migrador
    image: kamayuk-rentas-migrador:compose
    environment:
      # `base` es el servicio del compose de la plataforma, no `postgres`. En el
      # cluster es otro nombre y lo entrega el entorno (C-17, punto 1): el
      # descriptor pide `e.plataforma.motor` en vez de escribirlo. Lo que si es de
      # este sistema —y por eso coincide en los dos— es el nombre de SU base.
      KAMAYUK_DB_URL: jdbc:postgresql://base:5432/rentas
      KAMAYUK_DB_OWNER_USUARIO: kamayuk_owner
      KAMAYUK_DB_OWNER_CLAVE: ${KAMAYUK_CLAVE_OWNER:?falta KAMAYUK_CLAVE_OWNER, sale del .env de la plataforma}
    # Corre y termina. Si se reinicia vuelve a comprobar el ambiente y no aplica
    # nada: el migrador es idempotente y tiene su prueba que lo demuestra.
    restart: "no"

  # ── La implantacion: la fila de `municipalidad` en SU base ───────────────────
  #
  # La MISMA imagen que la aplicacion con el perfil `batch` (ADR-0003: un
  # artefacto, dos perfiles), asi que no abre ningun puerto y termina al acabar.
  #
  # En el cluster el migrador va de `initContainer` de este Job, porque un
  # `Deployment` no sabe esperar a un `Job` y Kubernetes no tiene `dependsOn`.
  # Aqui `depends_on: service_completed_successfully` es exactamente esa espera, y
  # por eso el orden se expresa como dependencia y no repitiendo el migrador.
  rentas-implantacion:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: aplicacion
    image: kamayuk-rentas:compose
    depends_on:
      rentas-migraciones:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: batch
      KAMAYUK_DB_URL: jdbc:postgresql://base:5432/rentas
      # `kamayuk_app` y solo `kamayuk_app`: sin DDL, sin BYPASSRLS, sin DELETE y
      # propietario de nada.
      KAMAYUK_DB_USUARIO: kamayuk_app
      KAMAYUK_DB_CLAVE: ${KAMAYUK_CLAVE_APP:?falta KAMAYUK_CLAVE_APP, sale del .env de la plataforma}
      # El prefijo es `kamayuk.implantacion`: `DatosDeImplantacion` declara
      # `@ConfigurationProperties("kamayuk.implantacion")` y `RegistroDeMunicipalidadesJdbc`
      # lee `${kamayuk.implantacion.url}` y `${kamayuk.implantacion.owner-clave}`.
      #
      # Hasta R-A/B `rentas` leia `sgtm.implantacion` —era el monolito— mientras sus tres
      # hermanos ya usaban el del producto, y C-18 arreglo esa asimetria por el lado del
      # descriptor. R-A/B la deshace por el otro: renombra la propiedad en el Java.
      #
      # Con el prefijo equivocado esto NO FALLA: `ImplantarMunicipalidad` esta
      # condicionado a `@ConditionalOnProperty("kamayuk.implantacion.ubigeo")`, asi que
      # el runner no se registra, el proceso arranca, no hace nada y sale con codigo
      # 0. Lo medido en C-18: 13 migraciones aplicadas y `municipalidad` VACIA.
      KAMAYUK_IMPLANTACION_UBIGEO: ${KAMAYUK_UBIGEO:?falta KAMAYUK_UBIGEO en el .env de la plataforma}
      KAMAYUK_IMPLANTACION_NOMBRE: ${KAMAYUK_MUNICIPALIDAD:?falta KAMAYUK_MUNICIPALIDAD en el .env de la plataforma}
      KAMAYUK_IMPLANTACION_TIPO: ${KAMAYUK_TIPO_DE_MUNICIPALIDAD:-DISTRITAL}
      # La cuenta TIENE que ser la misma que el usuario de Keycloak: es lo unico
      # que une la fila de `usuario` con la identidad del token (ADR-0005).
      KAMAYUK_IMPLANTACION_ADMINISTRADOR: ${KAMAYUK_ADMINISTRADOR:?falta KAMAYUK_ADMINISTRADOR (ver identidad/datos-de-implantacion.sh)}
      KAMAYUK_IMPLANTACION_NOMBREDELADMINISTRADOR: ${KAMAYUK_NOMBRE_DEL_ADMINISTRADOR:-Administrador del sistema}
      # Por omision `true`, al reves que en el codigo: aqui se levanta una marcha
      # blanca, y mientras D-02a siga abierta toda cifra sale de parametros que
      # nadie ha firmado. Solo se aplica al ALTA.
      KAMAYUK_IMPLANTACION_ESDEMOSTRACION: ${KAMAYUK_ES_DEMOSTRACION:-true}
      KAMAYUK_IMPLANTACION_URL: jdbc:postgresql://base:5432/rentas
      # OWNERCLAVE sin guion bajo: en una variable de entorno el `_` se traduce a
      # punto, asi que `KAMAYUK_IMPLANTACION_OWNER_CLAVE` seria
      # `kamayuk.implantacion.owner.clave` y no `owner-clave`.
      KAMAYUK_IMPLANTACION_OWNERCLAVE: ${KAMAYUK_CLAVE_OWNER:?falta KAMAYUK_CLAVE_OWNER, sale del .env de la plataforma}
      # ── El consumidor del buzon de `identidad` (ADR-0039, etapa 5) ──
      # La implantacion TERMINA con una pasada del consumidor, que trae lo que
      # `identidad` diga de esta municipalidad. Son las mismas seis variables que
      # el CronJob del descriptor le da al proceso en el cluster.
      #
      # DESDE LA ETAPA 5 NO SON OPCIONALES, y el orden de los despliegues tampoco:
      # `identidad` PRIMERO. El sembrador de este sistema ya no escribe usuarios,
      # grupos ni permisos —solo el catalogo—, asi que la unica cuenta que puede
      # entrar llega por el buzon. Sin buzon, sin respuesta, o con respuesta vacia
      # porque `identidad` todavia no implanto esta municipalidad, la implantacion
      # FALLA nombrando lo que falta en vez de salir con codigo 0: un contenedor
      # que sale bien se lee como `Complete`, y eso es lo que C-18 encontro haciendo
      # el Job de `rentas` durante meses.
      #
      # `identidad-sistema` y no `identidad`: en la red `kamayuk-plataforma` el alias
      # `identidad` es KEYCLOAK (es a quien se le pide el token, dos lineas mas
      # abajo). La URL va ENTERA, con su prefijo `/identidad/api/v1`.
      KAMAYUK_IDENTIDAD_URL: http://identidad-sistema:8080/identidad/api/v1
      KAMAYUK_IDENTIDAD_TOKEN: http://identidad:8080/realms/kamayuk/protocol/openid-connect/token
      # El mismo cliente de servicio que el ingestor: uno por (sistema, municipalidad).
      # De su ubigeo sale de que municipalidad es el buzon que se lee.
      KAMAYUK_IDENTIDAD_CLIENTE: kamayuk-rentas-servicio-${KAMAYUK_UBIGEO:?falta KAMAYUK_UBIGEO en el .env de la plataforma}
      # La clave que `reconciliar-identidades.sh` le fijo a ese cliente para el par
      # (rentas, identidad). Vacia por omision: sin ella la peticion sale sin
      # cabecera e `identidad` contesta 401, que es transitorio y se ve en el registro.
      KAMAYUK_IDENTIDAD_CREDENCIAL: ${KAMAYUK_RENTAS_CREDENCIAL_DE_IDENTIDAD:-}
      # A quien se avisa cuando un evento no se puede aplicar (ADR-0026 §4). La misma
      # persona y el mismo canal que el ingestor del padron.
      KAMAYUK_IDENTIDAD_RESPONSABLE: ${KAMAYUK_RESPONSABLE_DE_OPERACION:?falta KAMAYUK_RESPONSABLE_DE_OPERACION en el .env de la plataforma}
      KAMAYUK_IDENTIDAD_CANAL: ${KAMAYUK_CANAL_DE_OPERACION:?falta KAMAYUK_CANAL_DE_OPERACION en el .env de la plataforma}
    restart: "no"

  # ── El backend ──────────────────────────────────────────────────────────────
  #
  # EL SERVICIO SE LLAMA COMO EL SISTEMA, y no `aplicacion`. No es estilo: los
  # cuatro composes comparten la red `kamayuk-plataforma`, y Compose le da a cada
  # servicio un alias de red con su nombre — cuatro servicios llamados
  # `aplicacion` dejarian ese alias resolviendo a uno cualquiera de los cuatro.
  # Ademas es el nombre que la propia aplicacion da por hecho: el valor por
  # omision de `kamayuk.caja.origenes` es `http://rentas:8080/rentas/api/v1`.
  rentas:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: aplicacion
    image: kamayuk-rentas:compose
    depends_on:
      rentas-implantacion:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: web
      KAMAYUK_DB_URL: jdbc:postgresql://base:5432/rentas
      KAMAYUK_DB_USUARIO: kamayuk_app
      KAMAYUK_DB_CLAVE: ${KAMAYUK_CLAVE_APP:?falta KAMAYUK_CLAVE_APP, sale del .env de la plataforma}
      # Sin el emisor la aplicacion se NIEGA a arrancar, y es deliberado: un
      # backend que atiende sin poder validar un token responde a la sonda, se
      # declara sano y no atiende a nadie (ADR-0005).
      #
      # Es el MISMO realm que los otros tres: un login para los cuatro
      # (ADR-0030 §3).
      KAMAYUK_OIDC_EMISOR: ${KAMAYUK_OIDC_EMISOR:-http://localhost:8180}/realms/kamayuk
      # El emisor es una identidad, no una direccion de red. El navegador llega a
      # Keycloak por su nombre publico y este contenedor por el interno de la red
      # del compose; usar el publico para las dos cosas haria que el backend
      # buscara el JWKS en si mismo y todo token seria invalido por un motivo que
      # no se parece a su causa.
      KAMAYUK_OIDC_JWKS: http://identidad:8080/realms/kamayuk/protocol/openid-connect/certs
      # ── Los tres vecinos (#25) ────────────────────────────────────────────
      #
      # Sin estas tres, `rentas` levanta, la sonda dice UP y TRES de sus
      # operaciones contestan 500: las tres se declaran
      # `@Value("${kamayuk.<sistema>.url:}")`, o sea CON CADENA VACIA POR
      # OMISION, asi que el defecto no aparece hasta la primera llamada y el
      # navegador solo ve un ERROR_INTERNO con un identificador de incidencia.
      # Habia que entrar al contenedor a leer el registro para descubrir que lo
      # que faltaba era una variable de entorno.
      #
      # Apuntan al ALIAS DE RED de cada sistema en `kamayuk-plataforma`, que es
      # el nombre de su servicio en su propio compose —`caja`, `catastro` y
      # `normativa`—. Por eso el servicio de cada sistema se llama como el
      # sistema y no `aplicacion`: ver la nota de arriba.
      #
      # El puerto es el 8080 (el del contenedor) y no el publicado, porque esto
      # va por la red interna y no por Traefik. Y la raiz incluye el prefijo de
      # la API del vecino: los tres clientes componen `raiz + ruta`.
      KAMAYUK_CAJA_URL: http://caja:8080/caja/api/v1
      KAMAYUK_CATASTRO_URL: http://catastro:8080/catastro/api/v1
      KAMAYUK_NORMATIVA_URL: http://normativa:8080/normativa/api/v1
    labels:
      # Su prefijo, y SOLO el suyo. Reclamar el de otro no falla: se lo queda, y
      # las peticiones dejan de llegar a su dueno. Es la misma prohibicion (a) que
      # `descriptor/auditoria.ts` aplica en el cluster.
      #
      # DESDE #44 LA REGLA ES `/rentas/api/v1` Y NO `/rentas`, porque ahora hay
      # dos cosas bajo ese prefijo: esta API y la interfaz. El reparto es el mismo
      # que `ingreso()` declara para el cluster, y tiene que serlo (ADR-0011).
      #
      # Se estrecha SIN PERDER NADA, y esta medido: lo unico que este proceso
      # sirve bajo `/rentas` es `Api.RAIZ`, que es `/rentas/api/v1` entera
      # (`kamayuk/rentas/web/Api.java:13`). El actuator vive en `/actuator/...`,
      # o sea que `PathPrefix(/rentas)` nunca lo enrutaba — la sonda de aqui
      # abajo lo pide por `localhost:8080` y no por Traefik, a proposito.
      #
      # Y NO se le quita el prefijo: `Api.RAIZ` es la ruta entera, asi que un
      # `stripprefix` aqui dejaria a Spring buscando `/api/v1/...` y contestando
      # 404 a todo. El `stripprefix` es de la interfaz, y solo de ella.
      #
      # La PRIORIDAD va escrita. Traefik v3 ordena por longitud de la regla
      # cuando nadie la declara, y `/rentas/api/v1` es mas larga que `/rentas`,
      # asi que hoy saldria bien POR ACCIDENTE. El fallo al reves no grita: la
      # API la contestaria el nginx, cuyo `try_files` devuelve el `index.html`
      # con un **200**, y la pantalla recibiria HTML donde espera JSON.
      - traefik.enable=true
      - traefik.http.routers.rentas.rule=PathPrefix(`/rentas/api/v1`)
      - traefik.http.routers.rentas.priority=20
      - traefik.http.services.rentas.loadbalancer.server.port=8080
    healthcheck:
      # `/actuator/health` y no `/actuator/health/liveness`: aqui esta sonda
      # alimenta `depends_on: service_healthy`, o sea «esta listo para atender», y
      # el grupo entero incluye el indicador de la base. En el cluster son tres
      # sondas distintas y la de VIDA es la del grupo `liveness` a proposito
      # (C-17, punto 2): matar el proceso no devuelve la base.
      #
      # Las tres rutas —esta y las dos del descriptor— tienen que estar entre las
      # que `SeguridadWeb` permite sin token, y eso lo comprueba
      # `sondas-contra-la-cadena` leyendo el Java. Con la cadena anterior a C-17
      # esto contestaba 401 y `curl --fail` dejaba el contenedor `unhealthy` para
      # siempre, con la aplicacion sana.
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/actuator/health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 30s

  # ── La interfaz (#44) ───────────────────────────────────────────────────────
  #
  # `rentas-web` compilado y servido por nginx. La imagen es
  # `kamayuk-rentas-interfaz` y NUNCA `kamayuk-rentas-web`: ese nombre ya es el
  # del BACKEND con el perfil `web` de Spring en el descriptor, y darselo aqui
  # dejaria dos artefactos del producto llamados igual.
  #
  # POR QUE SE LLAMA `rentas-interfaz` Y NO `interfaz`
  #
  # Por lo mismo que el backend se llama `rentas` y no `aplicacion`, escrito unas
  # lineas mas arriba: los cuatro composes comparten la red `kamayuk-plataforma` y
  # Compose le da a cada servicio un alias de red con su nombre. ADR-0030 §1 dice
  # que habra CUATRO interfaces, y el dia de la segunda un alias `interfaz`
  # resolveria a una cualquiera de las dos. El sintoma de eso no es un error: es
  # una peticion que a veces llega a quien no era.
  #
  # SIN `depends_on`, Y ESO ES UNA AFIRMACION (AC-8 de #44)
  #
  # Esta interfaz no necesita el backend para dibujarse, y tampoco para hablar con
  # el: `frontend/nginx.conf` NO reenvia a ningun sitio. Quien pone la pantalla y
  # la API en el mismo origen —que es lo unico que hace falta, porque el backend
  # no publica ni una cabecera CORS— es Traefik, con las dos reglas de aqui.
  #
  # Declarar una dependencia que no existe costaria dos cosas: haria que el
  # compose MINTIERA sobre el grafo —que es justo lo que la guarda de
  # `infrastructure` compara contra el descriptor— y obligaria a
  # `up -d rentas-interfaz` a levantar antes la base, el migrador y la
  # implantacion para servir unos archivos que no los usan.
  #
  # Lo unico que SI necesita de fuera es la red `kamayuk-plataforma`, porque este
  # archivo entero la declara `external: true`.
  rentas-interfaz:
    build:
      # El contexto es `frontend/` y no la raiz, al reves que los tres de arriba:
      # el `.dockerignore` que lo acota —`frontend/.dockerignore`— solo se aplica
      # desde la raiz del contexto, y el de la raiz excluye `frontend/` entero,
      # asi que no diria nada de esta imagen.
      context: ../frontend
      # Y desde #75, el clon hermano por un CONTEXTO CON NOMBRE. Decia aqui que
      # este `Dockerfile` «no tiene ni un COPY que salga de ahi» y ya no es
      # cierto: `frontend/package.json` declara tres `link:` a `kamayuk-lib`.
      #
      # Sin esta clave, `COPY --from=kamayuk-lib` no es ni una etapa ni un
      # contexto declarado, y BuildKit lo resuelve como NOMBRE DE IMAGEN — o sea
      # que se va a buscar `docker.io/library/kamayuk-lib:latest`. El rojo
      # aparece al teclear `up --build`, no en CI, que es donde nadie mira.
      #
      # La ruta esta medida y no depende de contra que base la resuelva compose:
      # `despliegue/../../kamayuk-lib` y `frontend/../../kamayuk-lib` dan el
      # mismo directorio, y coincide letra por letra con el `link:` del
      # `package.json`. Pide `docker compose` >= v2.17.0.
      additional_contexts:
        kamayuk-lib: ../../kamayuk-lib
      target: interfaz
    image: kamayuk-rentas-interfaz:compose
    # EL PUERTO LLEVA EL SUFIJO DEL SISTEMA, y no es capricho (AC-8 de #44).
    #
    # `KAMAYUK_PUERTO_INTERFAZ` a secas YA LO USA la interfaz del monolito
    # —`infrastructure/despliegue/compose.yaml` publica
    # `${KAMAYUK_PUERTO_INTERFAZ:-8081}:8080`— y el `.env` es EL MISMO para todo
    # esto. Reusar el nombre tendria dos efectos, los dos malos: con ese `.env`
    # delante el valor por omision de aqui NO SE APLICARIA NUNCA, asi que
    # documentar `:8083` seria documentar algo falso; y las dos interfaces
    # pedirian el mismo puerto del anfitrion y se pelearian por el. Es lo que
    # `caja`#39 midio.
    #
    # 8083 porque 8080 es el ingreso del monolito, 8081 su interfaz y 8082 lo
    # toma por omision la de `caja` —y en esta instalacion, el propio Traefik—.
    # Comprobado libre antes de escribirlo.
    #
    # PARA QUE SIRVE, existiendo Traefik: para mirar el nginx SIN el ingreso
    # delante. Por aqui las rutas llegan con el prefijo puesto, o sea que
    # `/rentas/...` cae en el bloque que contesta 404 diciendo que falta el
    # `stripprefix` — que es exactamente lo que se quiere poder distinguir
    # cuando algo no llega.
    ports:
      - "${KAMAYUK_PUERTO_INTERFAZ_RENTAS:-8083}:8080"
    labels:
      # La otra mitad del reparto. Prioridad MENOR que la de la API, escrita y no
      # heredada de la longitud de la regla: ver la nota del servicio `rentas`.
      #
      # Y aqui SI se quita el prefijo, porque este nginx sirve en la raiz de su
      # contenedor. Que el paquete lo pida con el prefijo puesto lo garantiza
      # `vite.config.ts` con `base: '/rentas/'` (ADR-0030 §2).
      - traefik.enable=true
      - traefik.http.routers.rentas-interfaz.rule=PathPrefix(`/rentas`)
      - traefik.http.routers.rentas-interfaz.priority=10
      - traefik.http.routers.rentas-interfaz.middlewares=rentas-quitar-prefijo
      - traefik.http.middlewares.rentas-quitar-prefijo.stripprefix.prefixes=/rentas
      - traefik.http.services.rentas-interfaz.loadbalancer.server.port=8080
    # SIN `healthcheck` aqui, y tampoco es un olvido: `frontend/Dockerfile` ya
    # declara el suyo —`wget --spider -q http://127.0.0.1:8080/index.html`, por
    # 127.0.0.1 y no `localhost` porque este nginx escucha solo en IPv4— y Docker
    # aplica el `HEALTHCHECK` de la imagen al contenedor, que es de donde
    # `up --wait` lee la salud. Copiarlo aqui seria un segundo sitio con la misma
    # verdad, y el que envejece sin ponerse rojo.

# La red de la plataforma, QUE YA EXISTE. `external: true` es lo que impide que
# este compose cree una segunda con el mismo nombre y deje a los servicios sin
# verse: el sintoma seria «Connection refused» a `base`, que se lee como que el
# motor no esta levantado.
networks:
  default:
    name: kamayuk-plataforma
    external: true
