name: Frontend

# La CI de `rentas-web`. Corre `yarn verificar` —lint, tipos y pruebas— y nada mas: aqui no
# se construye imagen ni se despliega, porque F-1 levanta el andamiaje y ninguna pantalla.
#
# POR QUE SI LLEVA FILTRO `paths`, AL REVES QUE `publicar-imagenes.yml`
# Alli el filtro seria un defecto: la guarda de `infrastructure` necesita que TODO commit de
# `main` tenga sus dos imagenes, y con filtro un merge de solo documentacion dejaria un `sha`
# de `main` sin imagenes, en silencio. Aqui no se publica nada que nadie vaya a pedir por su
# etiqueta, asi que la equivalencia no hace falta y el filtro solo evita gastar una
# instalacion de npm en cada cambio del backend.
#
# El workflow se incluye en su propio filtro: un cambio en este archivo tiene que verificarse
# a si mismo. Sin eso, romper la CI del frontend es el unico cambio que la CI del frontend no
# revisa.
#
# SI NECESITA UN CLON HERMANO, DESDE #74. Este comentario decia lo contrario —«el frontend
# todavia no depende de ningun paquete `@kamayuk/*` publicado […] el dia que dependa, este
# archivo se parecera a aquel»— y ese dia llego: `frontend/package.json` declara
# `@kamayuk/{api,formato,sesion}` como `link:../../kamayuk-lib/paquetes/*`, que yarn resuelve
# contra el DISCO y ninguna variable de entorno redirige. Asi que la disposicion de clones
# hermanos no es una preferencia: esta escrita en el `package.json`.
#
# Por eso el anfitrion baja a `path: rentas` y `kamayuk-lib` se clona a su lado. Es el mismo
# patron que `infraestructura.yml` usa para `@kamayuk/infra-contrato`, con una diferencia: alli
# `path: infrastructure` a secas no valia porque chocaba con el directorio `infrastructure/`
# que este repositorio ya tiene dentro. `kamayuk-lib` no tiene esa colision.
#
# LO QUE EL FILTRO `paths` NO PUEDE VER, y hay que saberlo: un cambio en `kamayuk-lib` no
# dispara ninguna corrida aqui. La CI de `rentas` se pondra roja en el siguiente PR que toque
# `frontend/**` por algo que no cambio en `rentas`, y el `git log` de este repositorio no lo
# explicara. Es el coste que ADR-0038 §3 conto: «+1 clon, que hoy no tienen ninguno».

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend.yml"]

# Sin permisos de escritura: este trabajo lee y verifica, no publica nada.
permissions:
  contents: read

jobs:
  verificar:
    name: La interfaz cumple sus reglas
    runs-on: ubuntu-latest
    # Un colgado no consume cuota sin limite: la leccion de `observabilidad-alertas`.
    timeout-minutes: 10
    steps:
      # El anfitrion BAJA UN NIVEL para que el hermano quepa a su lado. `actions/checkout` se
      # niega a escribir fuera de `GITHUB_WORKSPACE`, asi que no se puede clonar hacia arriba:
      # lo que se mueve es este repositorio, y el espacio de trabajo pasa a hacer de padre.
      - name: Este repositorio
        uses: actions/checkout@v4
        with:
          path: rentas

      # El clon hermano del que cuelgan los tres `link:` de `frontend/package.json`.
      #
      # El repliegue `|| github.token` es el que llevan los catorce workflows de los seis clones
      # que ya clonan un hermano, y aqui hay una razon added: `GH_CLONE_KEY` puede ser un PAT de
      # alcance fino que enumera los repositorios del producto, y `kamayuk-lib` no existia
      # cuando se emitio. Si el checkout muere con «Repository not found», es eso.
      - name: Las librerias comunes
        uses: actions/checkout@v4
        with:
          repository: hneyra/kamayuk-lib
          path: kamayuk-lib
          token: ${{ secrets.GH_CLONE_KEY || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          # La ruta sigue al anfitrion. Si se olvida, `setup-node` NO se salta la cache: FALLA
          # el paso, antes de instalar nada y con un mensaje que habla de cache y no de rutas
          # —«Some specified paths were not resolved, unable to cache dependencies»—. En local
          # el concepto no existe.
          cache-dependency-path: rentas/frontend/yarn.lock

      # `--frozen-lockfile` y no `yarn install` a secas: sin el, una version nueva de
      # cualquier dependencia entra en la CI sin pasar por ningun PR, y el dia que rompa
      # algo el diff no lo explica.
      #
      # Y ojo con lo que este paso NO garantiza: con el clon hermano ausente, `yarn install
      # --frozen-lockfile` sale con **codigo 0** y no enlaza nada —medido; `--check-files`
      # tampoco lo caza—. Quien lo detecta es `verificaciones/enlace-con-kamayuk-lib.test.ts`,
      # dentro de `yarn verificar`, y lo dice nombrando el `git clone`.
      - name: Instalar
        working-directory: rentas/frontend
        run: yarn install --frozen-lockfile

      # La MISMA orden que se ejecuta en local. Si aqui se escribieran los tres pasos por
      # separado, «verde en CI» y «verde en mi maquina» dejarian de ser la misma afirmacion
      # en cuanto una de las dos cambiara.
      - name: Verificar
        working-directory: rentas/frontend
        run: yarn verificar

      # El bundle no se publica todavia, pero se construye: un `tsc` en verde no demuestra
      # que Vite sepa empaquetar esto, y descubrirlo el dia del despliegue es tarde.
      - name: Construir el bundle
        working-directory: rentas/frontend
        run: yarn build

  # ---------------------------------------------------------------------------------------
  # AC7 de I-2 (#28). EL ARNES DE EXTREMO A EXTREMO, DECLARADO Y **NO FINGIDO**.
  #
  # Este trabajo NO corre hoy, y el criterio de aceptacion lo permite con una condicion: que
  # diga lo que le falta en vez de pasar en verde sin mirar. Asi que el paso «Lo que falta»
  # corre SIEMPRE y lo deja escrito en el registro de cada PR; los pasos que de verdad
  # verifican algo solo corren cuando la instalacion existe, y entonces corren con
  # `KAMAYUK_E2E_EXIGIR=1`, que convierte «no hay instalacion» en un fallo en vez de un salto.
  #
  # POR QUE NO SE PUEDE LEVANTAR LA INSTALACION AQUI, medido y no supuesto. Son cuatro cosas
  # y ninguna se arregla en este repositorio:
  #
  #   1. `despliegue/plataforma.compose.yaml` vive en `infrastructure`, otro repositorio.
  #      Levantarlo desde aqui pide clonarlo y mantener las dos versiones en paso.
  #   2. El realm `sgtm` con el cliente `kamayuk-backoffice` —PKCE S256, redirect
  #      `http://localhost:5173/*`— y las tres cuentas lo describe tambien `infrastructure`.
  #   3. **Los datos no estan en ningun repositorio.** Los caminos afirman cosas como
  #      «SULLON VILCHEZ-JOSE RAUL» y las etapas «Padrón leído»/«Simulados», que salen del
  #      volcado de la marcha blanca del contenedor `sgtm-base-1` —42 tablas con filas— y ese
  #      volcado no se versiona. Un CI que levantara la plataforma vacia tendria backend,
  #      Keycloak y base, y **aun asi** todos los caminos en rojo por falta de padron.
  #   4. `KAMAYUK_E2E_CLAVE` tendria que existir como secreto del repositorio. Hoy no existe.
  #
  # Lo que SI se verifica en cada PR sin instalacion son las propiedades del arnes que son del
  # arbol de archivos —donde vive, que no entra en `yarn verificar`, que no lleva ninguna clave
  # escrita, que levanta Vite con el proxy de datos apagado—: eso lo hace
  # `verificaciones/arnes-e2e.test.ts`, dentro del trabajo de arriba, que si es bloqueante.
  # ---------------------------------------------------------------------------------------
  arnes:
    name: El arnes de extremo a extremo (declarado; sin instalacion en CI todavia)
    runs-on: ubuntu-latest
    needs: verificar
    timeout-minutes: 20
    steps:
      - name: Este repositorio
        uses: actions/checkout@v4
        with:
          path: rentas

      - name: Las librerias comunes
        uses: actions/checkout@v4
        with:
          repository: hneyra/kamayuk-lib
          path: kamayuk-lib
          token: ${{ secrets.GH_CLONE_KEY || github.token }}

      # Corre SIEMPRE. Es lo que impide que este trabajo sea un verde que no mira nada: el
      # registro de cada PR dice, con nombre y apellido, que le falta para poder verificar.
      - name: Lo que le falta a este trabajo para poder correr
        run: |
          echo "El arnes de extremo a extremo (frontend/e2e) NO corre en esta CI todavia."
          echo "Le faltan cuatro cosas, y ninguna esta en este repositorio:"
          echo "  1. despliegue/plataforma.compose.yaml, que vive en «infrastructure» — y desde"
          echo "     #74 clonar un hermano YA se hace aqui, asi que lo que falta no es poder"
          echo "     clonarlo, sino mantener las dos versiones en paso"
          echo "  2. el realm «sgtm» con el cliente «kamayuk-backoffice» y sus tres cuentas"
          echo "  3. el volcado de datos de la marcha blanca, que no se versiona en ningun sitio"
          echo "  4. el secreto KAMAYUK_E2E_CLAVE"
          echo ""
          echo "Con las cuatro puestas, este trabajo corre solo y con KAMAYUK_E2E_EXIGIR=1,"
          echo "que hace que la ausencia de instalacion FALLE en vez de saltarse."
          echo ""
          echo "En local: cd frontend && yarn e2e"

      - name: Hay instalacion?
        id: hay
        env:
          CLAVE: ${{ secrets.KAMAYUK_E2E_CLAVE }}
        run: |
          if [ -n "$CLAVE" ]; then
            echo "instalacion=si" >> "$GITHUB_OUTPUT"
          else
            echo "instalacion=no" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.hay.outputs.instalacion == 'si'
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: rentas/frontend/yarn.lock

      - name: Instalar
        if: steps.hay.outputs.instalacion == 'si'
        working-directory: rentas/frontend
        run: yarn install --frozen-lockfile

      # El navegador se descarga aparte y no viene con la dependencia: `@playwright/test` trae
      # el arnes, no Chromium.
      - name: Instalar Chromium
        if: steps.hay.outputs.instalacion == 'si'
        working-directory: rentas/frontend
        run: yarn e2e:navegador

      - name: Correr el arnes
        if: steps.hay.outputs.instalacion == 'si'
        working-directory: rentas/frontend
        env:
          KAMAYUK_E2E_CLAVE: ${{ secrets.KAMAYUK_E2E_CLAVE }}
          # Sin esto, un CI sin instalacion se saltaria los caminos y saldria VERDE. Aqui la
          # instalacion tenia que estar, asi que su ausencia es un fallo.
          KAMAYUK_E2E_EXIGIR: "1"
        run: yarn e2e

      - uses: actions/upload-artifact@v4
        if: always() && steps.hay.outputs.instalacion == 'si'
        with:
          name: informe-del-arnes
          # Tambien sigue al anfitrion, y si se olvida NO falla: `upload-artifact` solo avisa
          # cuando el glob no casa, el paso sale verde y el informe no se sube.
          path: rentas/frontend/playwright-report/
          retention-days: 7
