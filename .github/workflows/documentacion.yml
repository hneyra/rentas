# Verificación de la documentación que se comprueba sola.
#
# Desde P5B queda **una**, y conviene decir dónde están las otras: el corpus de valores
# normativos y sus seis verificadores se fueron a `normativa` con el servicio (ADR-0025 §5,
# «la doble verificación empieza en el documento y no en la fila»), y allí corren en el
# flujo `Documentación` de aquel repositorio. Lo que se queda aquí es lo que es de este
# sistema:
#
#   · el **contrato de la API** (#312) — que `rentas-v1.yaml` sea todavía lo que su
#     generador produce. Existe porque el contrato dejó de poder reproducirse sin que nada
#     se pusiera rojo: seguía siendo válido, el backend lo cumplía y el frontend generaba
#     sus tipos de él, y aun así regenerarlo borraba 519 líneas y dos operaciones enteras.
#
# Va en su propio flujo y no dentro del del backend porque no necesita Gradle ni base de
# datos: es Node pelado sobre archivos de `docs/`.
name: Documentación

on:
  pull_request:
    paths: &rutas
      - '.github/workflows/documentacion.yml'
      # El contrato y el prototipo del que se deriva: son las DOS entradas del
      # generador de OpenAPI, y tocar cualquiera de ellas sin la otra es
      # exactamente lo que la comprobación tiene que ver.
      - 'docs/50-api/**'
      # El prototipo del que se deriva el contrato. En `sgtm` vivia en `design/`; aqui viaja
      # como entrada declarada del generador (ver docs/50-api/generar-openapi.mjs).
      - 'docs/50-api/prototipo/sgtm-data-*.js'
  push:
    branches: [main]
    paths: *rutas
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    name: Documentación que se comprueba sola
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No escribe el archivo: lo regenera en memoria y exige que sea el mismo.
      # Se comprobó que muerde, en las dos direcciones: retocando un `summary`
      # del YAML a mano, borrando de él la operación `permisos_de_la_sesion`
      # entera, y quitándole al generador la descripción de un parámetro de ruta.
      # Las tres lo ponen rojo, con la línea y las dos versiones.
      - name: El contrato de la API es el que su generador produce
        run: node docs/50-api/generar-openapi.mjs --comprobar

      # NOTAS DEL CORTE
      #
      # P5A: faltaba la autoprueba de `scripts/catastro/importar_predios_gpkg.py`. `scripts/`
      # no viajó —el importador del plano es de `catastro` y se va con él en P5C—. Se retiró
      # en vez de dejarse apuntando a un archivo que no existe: un paso que falla por no
      # encontrar su guion es indistinguible de uno que falla porque el guion está mal.
      #
      # P5B: se fueron los SEIS pasos del corpus normativo, con el corpus. Corren en el flujo
      # `Documentación` de `normativa`, que es donde están los archivos que leen. Ninguno se
      # perdió: se comprobó ejecutándolos allí, incluidas sus muestras rotas a propósito.
